# ~/.config/hypr/hyprlock.conf

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    # お気に入りの壁紙を指定。path = screenshot にすると今の画面をぼかせます
    path = /home/sh1ragami/Pictures/wallpaper3.jpg 
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 3 # ぼかしを強くするとエモくなります
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# 時間（大きな時計）
label {
    monitor =
    text = $TIME
    color = rgba(242, 243, 244, 0.75)
    font_size = 95
    font_family = JetBrains Mono Extrabold # または Noto Sans JP
    position = 0, 200
    halign = center
    valign = center
}

# ユーザー名
label {
    monitor =
    text = Hello, $USER
    color = rgba(242, 243, 244, 0.75)
    font_size = 22
    font_family = JetBrains Mono
    position = 0, 80
    halign = center
    valign = center
}

# 入力欄
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1) # 半透明
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    rounding = -1 # 完全な円形
    check_color = rgb(204, 136, 34)
    placeholder_text = <i><span font_family="JetBrains Mono">Password...</span></i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}
