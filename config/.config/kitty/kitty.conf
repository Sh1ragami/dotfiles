# ==========================================================
# --- フォント設定 (隙間調整済み) ---
# ==========================================================
font_family      JetBrainsMono NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
# 文字の間隔を詰める (100%未満で狭くなります)

# 合字の有効化
disable_ligatures never

# --- デザイン・透過設定 ---
background_opacity 0.82
background_blur    1

# ウィンドウの余白 (文字が端に寄りすぎるのを防ぐ)
window_padding_width 4

# --- タブバーのデザイン ---
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #111
active_tab_background   #eee
inactive_tab_foreground #666
inactive_tab_background #333

# ==========================================================
# --- カラースキーム (Tokyo Night Optimized) ---
# ==========================================================
background            #1a1b26
foreground            #c0caf5
selection_background  #33467c
selection_foreground  #c0caf5

# Black
color0 #15161e
color8 #414868
# Red
color1 #f7768e
color9 #f7768e
# Green
color2 #9ece6a
color10 #9ece6a
# Yellow
color3 #e0af68
color11 #e0af68
# Blue
color4 #7aa2f7
color12 #7aa2f7
# Magenta
color5 #bb9af7
color13 #bb9af7
# Cyan
color6 #7dcfff
color14 #7dcfff
# White
color7  #a9b1d6
color15 #c0caf5

# ==========================================================
# --- 高度な設定 ---
# ==========================================================
# URLをクリック可能にする
detect_urls yes
url_color #73daca
url_style curly

# ベルの音をオフ
enable_audio_bell no

# 設定の再読み込みショートカットを有効化 (Ctrl+Shift+F5)
map ctrl+shift+f5 load_config_file

open_url_with firefox --new-window
