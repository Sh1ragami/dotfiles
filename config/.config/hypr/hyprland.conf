source = ~/.config/hypr/monitors.conf
# monitor=,preferred,auto,auto

$terminal = kitty
$fileManager = /home/sh1ragami/.config/hypr/scripts/toggle_thunar.sh
$fileManagerSecond = /home/sh1ragami/.config/hypr/scripts/toggle_yazi.sh
$menu = wofi
$logout = wlogout
$mainBrowser = firefox
$chat = class:^teams-for-linux$
$keyboardSounds = /home/sh1ragami/.config/waybar/scripts/vibes-menu.sh
$networkSettings = /home/sh1ragami/.config/hypr/scripts/toggle_wifi.sh

# 画面共有・投影ポータル安定化のための環境変数登録
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = python3 /home/sh1ragami/.config/hypr/scripts/wallpaper_daemon.py
exec-once = bash /home/sh1ragami/.config/hypr/scripts/waybar_daemon.sh
exec-once = swaync
exec-once = ags run ~/.config/ags
exec-once = python3 /home/sh1ragami/.config/hypr/scripts/clock_hover_trigger.py
# exec-once = conky --config ~/.config/conky/conky.conf
exec-once = nm-applet --indicator
exec-once = fcitx5 -d -r
exec-once = batsignal -w 15 -c 5 -d 2
exec-once = hypridle
exec-once = /home/sh1ragami/.config/hypr/scripts/close_on_move.sh
exec-once = /home/sh1ragami/.config/hypr/scripts/portal_reset.sh


env = HYPRCURSOR_THEME,catppuccin-mocha-dark-cursors
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,catppuccin-mocha-dark-cursors
env = XCURSOR_SIZE,24
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XMODIFIERS, @im=fcitx
env = QT_IM_MODULE, fcitx
env = QT_QPA_PLATFORMTHEME,qt6ct
env = MOZ_ENABLE_WAYLAND, 1
env = SDL_IM_MODULE, fcitx

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1


    layout = dwindle

    resize_on_border = true
    extend_border_grab_area = 15
}

decoration {
    rounding = 12

    # ウィンドウの透明度 (すべてのアプリをすりガラス風に少し透過)
    active_opacity = 0.93
    inactive_opacity = 0.85

    shadow {
        enabled = true
        range = 25
        render_power = 4
        color = rgba(00000088)
        color_inactive = rgba(00000033)
    }


    # すりガラス効果 (ぼかしの強度を上げて背後を柔らかくボカし、文字の視認性を確保)
    blur {
        enabled = true
        size = 8
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        xray = true
    }
}

# テーマカラーファイルの読み込み
source = ~/.config/hypr/theme.conf

# より躍動的で気持ちの良い動き（弾力と加減速）に変更
animations {
    enabled = true
    
    # イージング曲線の定義 (バネ感をさらに強化)
    bezier = fluent_decel, 0.1, 1, 0, 1
    bezier = fast_slide, 0.05, 0.9, 0.1, 1.0
    bezier = smooth_slide, 0.16, 1, 0.3, 1
    bezier = easeOutBack, 0.34, 1.5, 0.64, 1.05  # バネの戻り量を1.5に増やして躍動感をアップ
    bezier = workspaces_bezier, 0.15, 0.95, 0.1, 1.05 # ワークスペース切り替え時にも微細な弾み
    
    animation = windows, 1, 5, easeOutBack, popin 80%
    animation = windowsIn, 1, 5, easeOutBack, popin 80%
    animation = windowsOut, 1, 4, fluent_decel, popin 80%
    animation = windowsMove, 1, 4, easeOutBack, slide
    animation = fade, 1, 5, default
    animation = layers, 1, 2, fast_slide, slide
    animation = workspaces, 1, 5, workspaces_bezier, slide
    animation = specialWorkspace, 1, 4, easeOutBack, slidefadevert -35%
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
}

input {
    kb_layout = us
    kb_options = ctrl:nocaps,altwin:swap_ralt_rwin
    follow_mouse = 1
    sensitivity = 0.35
    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap-and-drag = true
        clickfinger_behavior = false
        tap_button_map = lrr
        disable_while_typing = true
        middle_button_emulation = false
        scroll_factor = 0.4
    }
}

gesture = 3, horizontal, workspace
gesture = 4, horizontal, workspace

gestures {
    workspace_swipe_distance = 220
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 15
    workspace_swipe_cancel_ratio = 0.3
    workspace_swipe_create_new = true
    workspace_swipe_forever = true
}

$mainMod = SUPER

bind = $mainMod, T, exec, $terminal
bind = $mainMod ctrl, T, exec, ~/.config/hypr/scripts/toggle_terminal.sh
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, pkill $logout || $logout
bind = $mainMod, O, exec, obsidian
bind = $mainMod ctrl, G, exec, google-chrome-stable --new-window https://gemini.google.com/
bind = $mainMod, G, exec, ~/.config/hypr/scripts/toggle_gemini.sh
bind = $mainMod, space, exec, pkill wofi || wofi --show drun

bind = $mainMod, E, exec, $fileManager
bind = $mainMod ctrl, E, exec, $fileManagerSecond

bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod ctrl, P, exec, nwg-displays
bind = $mainMod, J, layoutmsg, togglesplit,
bind = $mainMod, F, fullscreen
bind = $mainMod, B, exec, $mainBrowser
bind = $mainMod, W, exec, pkill -USR1 waybar
bind = $mainMod, R, exec, python3 ~/.config/hypr/scripts/theme_selector_gui.py
bind = $mainMod alt, S, exec, python3 ~/.config/swaync/scripts/docked_sliders_toggle.py

# 高速・影なし・二重起動防止スクリプトによるスクリーンショット
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh region
bind = ctrl, Print, exec, ~/.config/hypr/scripts/screenshot.sh gui
bind = $mainMod, Print, exec, ~/.config/hypr/scripts/screenshot.sh window

bind = $mainMod, Z, exec, pkill $keyboardSounds | $keyboardSounds
bind = $mainMod, N, exec, pkill $networkSettings | $networkSettings

bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod, mouse:272, movewindow

bind = $mainMod, X, exec, hyprctl clients | grep -q "chrome-pjbejonmbmbimhjphopcciclekgnpnpj-Default" && hyprctl dispatch focuswindow "class:^chrome-pjbejonmbmbimhjphopcciclekgnpnpj-Default$" || google-chrome-stable --app-id=pjbejonmbmbimhjphopcciclekgnpnpj
bind = $mainMod, C, exec, hyprctl clients | grep -q "teams-for-linux" && hyprctl dispatch focuswindow $chat || teams-for-linux

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod ctrl, left, movewindow, l
bind = $mainMod ctrl, right, movewindow, r
bind = $mainMod ctrl, up, movewindow, u
bind = $mainMod ctrl, down, movewindow, d
bind = $mainMod, h, exec, python3 ~/.config/hypr/scripts/theme_selector_gui.py left
bind = $mainMod, l, exec, python3 ~/.config/hypr/scripts/theme_selector_gui.py right
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
bind = $mainMod ctrl, h, movewindow, l
bind = $mainMod ctrl, l, movewindow, r
bind = $mainMod ctrl, k, movewindow, u
bind = $mainMod ctrl, j, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod ctrl, 1, movetoworkspace, 1
bind = $mainMod ctrl, 2, movetoworkspace, 2
bind = $mainMod ctrl, 3, movetoworkspace, 3
bind = $mainMod ctrl, 4, movetoworkspace, 4
bind = $mainMod ctrl, 5, movetoworkspace, 5
bind = $mainMod ctrl, 6, movetoworkspace, 6
bind = $mainMod ctrl, 7, movetoworkspace, 7
bind = $mainMod ctrl, 8, movetoworkspace, 8
bind = $mainMod ctrl, 9, movetoworkspace, 9
bind = $mainMod ctrl, 0, movetoworkspace, 10

bind = $mainMod ctrl, left,  swapwindow, l
bind = $mainMod ctrl, right, swapwindow, r
bind = $mainMod ctrl, up,    swapwindow, u
bind = $mainMod ctrl, down,  swapwindow, d
bind = $mainMod ctrl, H, swapwindow, l
bind = $mainMod ctrl, L, swapwindow, r
bind = $mainMod ctrl, K, swapwindow, u
bind = $mainMod ctrl, J, swapwindow, d

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = $mainMod ctrl, M, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = $mainMod ctrl, D, exec, swaync-client -d -sw

bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindel = , XF86KbdBrightnessUp, exec, brightnessctl -d *kbd* s 10%+
bindel = , XF86KbdBrightnessDown, exec, brightnessctl -d *kbd* s 10%-

xwayland {
    force_zero_scaling = true
}

# =========================================================================
# 🪟 WINDOW RULES (Hyprland 0.55+ 構文: windowrule = match:class ..., effect value)
# =========================================================================

# --- 1. デフォルトでフローティングにするアプリケーション ---

# 音量管理 & Bluetooth設定
windowrule = match:class pwvucontrol, float 1
windowrule = match:class pwvucontrol, size 900 650
windowrule = match:class pwvucontrol, center 1

windowrule = match:class com.saivert.pwvucontrol, float 1
windowrule = match:class com.saivert.pwvucontrol, size 900 650
windowrule = match:class com.saivert.pwvucontrol, center 1

windowrule = match:class pavucontrol, float 1
windowrule = match:class pavucontrol, size 800 600
windowrule = match:class pavucontrol, center 1

windowrule = match:class org.pulseaudio.pavucontrol, float 1
windowrule = match:class org.pulseaudio.pavucontrol, size 800 600
windowrule = match:class org.pulseaudio.pavucontrol, center 1

windowrule = match:class overskride, float 1
windowrule = match:class overskride, size 900 650
windowrule = match:class overskride, center 1

windowrule = match:class io.github.kaii_lb.Overskride, float 1
windowrule = match:class io.github.kaii_lb.Overskride, size 900 650
windowrule = match:class io.github.kaii_lb.Overskride, center 1

windowrule = match:class blueman-manager, float 1
windowrule = match:class blueman-manager, size 800 600
windowrule = match:class blueman-manager, center 1

# GNOME Settings, Network & Calendar (ネットワーク設定 & カレンダー)
windowrule = match:class nm-connection-editor, float 1
windowrule = match:class nm-connection-editor, size 900 650
windowrule = match:class nm-connection-editor, center 1

windowrule = match:class Nm-connection-editor, float 1
windowrule = match:class Nm-connection-editor, size 900 650
windowrule = match:class Nm-connection-editor, center 1

windowrule = match:class gnome-control-center, float 1
windowrule = match:class gnome-control-center, size 1000 700
windowrule = match:class gnome-control-center, center 1

windowrule = match:class org.gnome.ControlCenter, float 1
windowrule = match:class org.gnome.ControlCenter, size 1000 700
windowrule = match:class org.gnome.ControlCenter, center 1

windowrule = match:class org.gnome.Settings, float 1
windowrule = match:class org.gnome.Settings, size 1000 700
windowrule = match:class org.gnome.Settings, center 1

windowrule = match:class gnome-calendar, float 1
windowrule = match:class gnome-calendar, size 900 650
windowrule = match:class gnome-calendar, center 1

windowrule = match:class org.gnome.Calendar, float 1
windowrule = match:class org.gnome.Calendar, size 900 650
windowrule = match:class org.gnome.Calendar, center 1

# 画像ユーティリティ (Curtail / Switcheroo)
windowrule = match:class curtail, float 1
windowrule = match:class curtail, size 900 650
windowrule = match:class curtail, center 1

windowrule = match:class com.github.huluti.Curtail, float 1
windowrule = match:class com.github.huluti.Curtail, size 900 650
windowrule = match:class com.github.huluti.Curtail, center 1

windowrule = match:class switcheroo, float 1
windowrule = match:class switcheroo, size 900 650
windowrule = match:class switcheroo, center 1

windowrule = match:class io.gitlab.davem.Switcheroo, float 1
windowrule = match:class io.gitlab.davem.Switcheroo, size 900 650
windowrule = match:class io.gitlab.davem.Switcheroo, center 1

# 画像ビューア (Loupe - GNOME Image Viewer)
windowrule = match:class loupe, float 1
windowrule = match:class loupe, size 1050 750
windowrule = match:class loupe, center 1

windowrule = match:class org.gnome.Loupe, float 1
windowrule = match:class org.gnome.Loupe, size 1050 750
windowrule = match:class org.gnome.Loupe, center 1

# ポップアップカレンダー (gsimplecal)
windowrule = match:class gsimplecal, float 1
windowrule = match:class gsimplecal, size 650 480
windowrule = match:class gsimplecal, center 1

# PDFリーダー (Zathura - タイリング＆完全不透明ベタ塗り)
windowrule = match:class zathura, tile 1
windowrule = match:class zathura, opacity 1.0 override 1.0 override





# 音楽プレイヤー (Spotify)
windowrule = match:class Spotify, float 1
windowrule = match:class Spotify, size 1100 800
windowrule = match:class Spotify, center 1

# 動画プレイヤー (mpv - 透過無効化)
windowrule = match:class mpv, float 1
windowrule = match:class mpv, size 960 540
windowrule = match:class mpv, center 1
windowrule = match:class mpv, opacity 1.0 override 1.0 override

# ブラウザ (透明度はテーマ側で一括制御)


# 仮想マシンマネージャー (Virt-manager)
windowrule = match:class virt-manager, float 1
windowrule = match:class virt-manager, size 1000 750
windowrule = match:class virt-manager, center 1

# アーカイブ解凍 (File-roller)
windowrule = match:class file-roller, float 1
windowrule = match:class file-roller, size 800 600
windowrule = match:class file-roller, center 1
windowrule = match:class file-roller, pin 1

windowrule = match:class org.gnome.FileRoller, float 1
windowrule = match:class org.gnome.FileRoller, size 800 600
windowrule = match:class org.gnome.FileRoller, center 1
windowrule = match:class org.gnome.FileRoller, pin 1

# スキャナー
windowrule = match:class simple-scan, float 1
windowrule = match:class simple-scan, center 1

# メモアプリ (Obsidian)
windowrule = match:class obsidian, float 1
windowrule = match:class obsidian, size 1100 800
windowrule = match:class obsidian, center 1

# WiFi設定 (nmtui-float)
windowrule = match:class nmtui-float, float 1
windowrule = match:class nmtui-float, size 900 600
windowrule = match:class nmtui-float, center 1

# リソースモニター (btop)
windowrule = match:class btop-float, float 1
windowrule = match:class btop-float, size 1000 700
windowrule = match:class btop-float, center 1
windowrule = match:class btop-float, rounding 16

# Yazi (Kitty内のTUIファイルマネージャー - スクラッチパッド)
windowrule = match:class yazi-float, workspace special:yazi
windowrule = match:class yazi-float, float 1
windowrule = match:class yazi-float, size 950 650
windowrule = match:class yazi-float, center 1
windowrule = match:class yazi-float, rounding 16

# PWA
windowrule = match:class chrome-pjbejonmbmbimhjphopcciclekgnpnpj-Default, float 1
windowrule = match:class chrome-pjbejonmbmbimhjphopcciclekgnpnpj-Default, size 900 600
windowrule = match:class chrome-pjbejonmbmbimhjphopcciclekgnpnpj-Default, center 1

# Thunar (ファイルマネージャー - スクラッチパッド)
windowrule = match:class thunar, workspace special:thunar
windowrule = match:class thunar, float 1
windowrule = match:class thunar, size 1000 700
windowrule = match:class thunar, center 1
windowrule = match:class thunar, rounding 16

# フローティング Gemini (スクラッチパッド)
windowrule = match:class chrome-gemini.google.com__-Default, workspace special:gemini
windowrule = match:class chrome-gemini.google.com__-Default, float 1
windowrule = match:class chrome-gemini.google.com__-Default, size 850 580
windowrule = match:class chrome-gemini.google.com__-Default, center 1
windowrule = match:class chrome-gemini.google.com__-Default, rounding 16

# フローティング Terminal (スクラッチパッド)
windowrule = match:class kitty-scratchpad, workspace special:terminal
windowrule = match:class kitty-scratchpad, float 1
windowrule = match:class kitty-scratchpad, size 950 650
windowrule = match:class kitty-scratchpad, center 1
windowrule = match:class kitty-scratchpad, rounding 16

# 🌐 オンライン面接・Web会議アプリ (Zoom / Teams / Meet / WebEX) 最適化
windowrule = match:class ^(zoom)$, float 1
windowrule = match:title ^(Zoom - Free Account|Zoom Meeting|Select a window|Screen Share)$, float 1
windowrule = match:title ^(Teams|Microsoft Teams)$, float 1
windowrule = match:title ^(Open Files|Select File|Choose Files|Save File)$, float 1
windowrule = match:title ^(Open Files|Select File|Choose Files|Save File)$, size 900 600
windowrule = match:title ^(Open Files|Select File|Choose Files|Save File)$, center 1

# --- 2. ブラー & すりガラス効果 ---

layerrule = match:namespace waybar, blur 1
layerrule = match:namespace waybar, ignore_alpha 0

layerrule = match:namespace wofi, blur 1
layerrule = match:namespace wofi, ignore_alpha 0
layerrule = match:namespace wofi, animation slide bottom

layerrule = match:namespace swaync-control-center, blur 1
layerrule = match:namespace swaync-control-center, ignore_alpha 0.5
layerrule = match:namespace swaync-control-center, animation popin 80%

layerrule = match:namespace swaync-notification-window, blur 1
layerrule = match:namespace swaync-notification-window, ignore_alpha 0.5
layerrule = match:namespace swaync-notification-window, animation popin 80%
# Waybar ガラスモフィズム（すりガラス・背景ブラー）設定
layerrule = match:namespace waybar, blur 1
layerrule = match:namespace waybar, ignore_alpha 0

# AGS コントロールセンター（Dynamic Island 展開 & ブラー）
layerrule = match:namespace control-center, blur 1
layerrule = match:namespace control-center, animation slide top

# AGS スクリム（コントロールセンターの背景クリック領域）
layerrule = match:namespace cc-scrim, animation none

# スクリーンショット範囲選択（選択枠のアニメーションを無効化して即時消滅）
layerrule = match:namespace slurp, animation none





# =========================================================================

device {
    name = elan-trackpoint
    sensitivity = 0.4
    accel_profile = flat
    scroll_factor = 0.7
}

device {
    name = logitech-g300s-optical-gaming-mouse
    sensitivity = -0.5
}
