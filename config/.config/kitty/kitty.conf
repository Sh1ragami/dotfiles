# ==========================================================
# --- フォント設定 (隙間調整済み) ---
# ==========================================================
font_family      JetBrainsMono NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
# 文字の間隔を詰める (100%未満で狭くなります)

# 合字の有効化
disable_ligatures never

# --- デザイン・透過設定 ---
background_opacity 0.82
background_blur    1

# ウィンドウの余白 (文字が端に寄りすぎるのを防ぐ)
window_padding_width 4

# --- タブバーのデザイン ---
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #111
active_tab_background   #eee
inactive_tab_foreground #666
inactive_tab_background #333

# ==========================================================
# --- カラースキーム (Terracotta / Gruvbox Material Warm) ---
# ==========================================================
background            #241b19
foreground            #d4be98
selection_background  #3c3836
selection_foreground  #d4be98

# Black
color0 #1e1e1e
color8 #504945
# Red
color1 #ea6962
color9 #ea6962
# Green
color2 #a9b665
color10 #a9b665
# Yellow
color3 #d8a657
color11 #d8a657
# Blue
color4 #7daea3
color12 #7daea3
# Magenta
color5 #d3869b
color13 #d3869b
# Cyan
color6 #89b482
color14 #89b482
# White
color7  #dfd0b2
color15 #d4be98

# ==========================================================
# --- 高度な設定 ---
# ==========================================================
# URLをクリック可能にする
detect_urls yes
url_color #73daca
url_style curly

# ベルの音をオフ
enable_audio_bell no

# 設定の再読み込みショートカットを有効化 (Ctrl+Shift+F5)
map ctrl+shift+f5 load_config_file

open_url_with firefox --new-window
